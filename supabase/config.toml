project_id = "apms-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/**", "apms://**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "500MiB"

[functions.apms-predictions]
verify_jwt = true

[functions.ai-service-status]
verify_jwt = true

[functions.ai-model-artifact]
verify_jwt = false

[functions.apms-backups]
verify_jwt = false

[functions.auth-mfa-policy]
verify_jwt = true
