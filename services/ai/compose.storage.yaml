# Remote-artifact variant. Run from the repository root with this file instead
# of compose.yaml; it deliberately has no local model bind mount.
services:
  ai:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    image: apms-ai:local
    restart: unless-stopped
    environment:
      APMS_MODEL_ARTIFACT_PATH: ""
      APMS_AI_ARTIFACT_ENDPOINT: ${APMS_AI_ARTIFACT_ENDPOINT:?Set the private artifact Edge Function URL}
      APMS_AI_ARTIFACT_TOKEN: ${APMS_AI_ARTIFACT_TOKEN:?Set the machine-only artifact token}
      APMS_AI_ARTIFACT_MANIFEST_SHA256: ${APMS_AI_ARTIFACT_MANIFEST_SHA256:?Set the pinned manifest SHA-256}
      APMS_AI_ARTIFACT_CACHE_DIR: /tmp/apms-model-cache
      APMS_AI_SERVICE_API_KEY: ${APMS_AI_SERVICE_API_KEY:-}
      APMS_AI_ENABLE_SYNTHETIC_DEMO: ${APMS_AI_ENABLE_SYNTHETIC_DEMO:-false}
      APMS_AI_DEVICE: cpu
      APMS_AI_MAX_REQUEST_BYTES: ${APMS_AI_MAX_REQUEST_BYTES:-1048576}
      APMS_AI_MAX_CONCURRENT_REQUESTS: ${APMS_AI_MAX_CONCURRENT_REQUESTS:-2}
      OMP_NUM_THREADS: ${APMS_AI_THREADS:-2}
      MKL_NUM_THREADS: ${APMS_AI_THREADS:-2}
    ports:
      - "127.0.0.1:${APMS_AI_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - artifact-cache:/tmp/apms-model-cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    stop_grace_period: 30s

volumes:
  artifact-cache:
